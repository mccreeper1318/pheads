name: Repair 0.0.1-alpha.1 release

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-alpha1-release.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Build and attach missing alpha.1 artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out 0.0.1-alpha.1 tag
        uses: actions/checkout@v7
        with:
          ref: 0.0.1-alpha.1

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tagged project version
        run: |
          PROJECT_VERSION="$(./gradlew -q properties --no-daemon | sed -n 's/^version: //p' | head -n 1)"
          if [[ "$PROJECT_VERSION" != "0.0.1" ]]; then
            echo "Expected project version 0.0.1 at tag 0.0.1-alpha.1, found $PROJECT_VERSION"
            exit 1
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Build tagged release JAR
        run: ./gradlew clean build --no-daemon

      - name: Create tagged artifacts
        run: |
          SOURCE_JAR="build/libs/pheads-$PROJECT_VERSION.jar"
          TARGET_JAR="build/release/pheads-0.0.1-alpha.1.jar"

          if [[ ! -f "$SOURCE_JAR" ]]; then
            echo "Expected build output not found: $SOURCE_JAR"
            exit 1
          fi

          mkdir -p build/release
          cp "$SOURCE_JAR" "$TARGET_JAR"
          cd build/release
          sha256sum "pheads-0.0.1-alpha.1.jar" > "pheads-0.0.1-alpha.1.jar.sha256"

      - name: Attach artifacts to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "0.0.1-alpha.1" build/release/*.jar build/release/*.sha256 --clobber
