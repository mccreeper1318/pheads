name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            echo "Expected x.x.x, x.x.x-alpha.x, x.x.x-beta.x, or x.x.x-rc.x"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release branch lineage
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          .github/scripts/verify-release-lineage.sh "$TAG"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify project version matches release base version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PROJECT_VERSION="$(./gradlew -q properties --no-daemon | sed -n 's/^version: //p' | head -n 1)"
          RELEASE_BASE_VERSION="${TAG%%-*}"
          if [[ "$PROJECT_VERSION" != "$RELEASE_BASE_VERSION" ]]; then
            echo "Release tag $TAG has base version $RELEASE_BASE_VERSION, but the project version is $PROJECT_VERSION"
            exit 1
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Build release JAR
        run: ./gradlew clean build --no-daemon

      - name: Create tagged release artifacts
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SOURCE_JAR="build/libs/pheads-$PROJECT_VERSION.jar"
          TARGET_JAR="build/release/pheads-$TAG.jar"

          if [[ ! -f "$SOURCE_JAR" ]]; then
            echo "Expected build output not found: $SOURCE_JAR"
            exit 1
          fi

          mkdir -p build/release
          cp "$SOURCE_JAR" "$TARGET_JAR"
          cd build/release
          sha256sum "pheads-$TAG.jar" > "pheads-$TAG.jar.sha256"

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/release/*.jar build/release/*.sha256 --clobber
