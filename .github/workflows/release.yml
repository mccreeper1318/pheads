name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            echo "Expected x.x.x, x.x.x-alpha.x, x.x.x-beta.x, or x.x.x-rc.x"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify project version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PROJECT_VERSION="$(gradle -q properties --no-daemon | sed -n 's/^version: //p' | head -n 1)"
          if [[ "$PROJECT_VERSION" != "$TAG" ]]; then
            echo "Release tag $TAG does not match project version $PROJECT_VERSION"
            exit 1
          fi

      - name: Build release JAR
        run: gradle clean build --no-daemon

      - name: Create SHA-256 checksum
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p build/release
          cp "build/libs/pheads-$TAG.jar" build/release/
          cd build/release
          sha256sum "pheads-$TAG.jar" > "pheads-$TAG.jar.sha256"

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/release/*.jar build/release/*.sha256 --clobber
