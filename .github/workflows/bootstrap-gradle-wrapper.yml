name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  wrapper:
    name: Generate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Generate wrapper
        run: |
          gradle wrapper --gradle-version 9.7.1 --distribution-type bin
          chmod +x gradlew

      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Add Gradle 9.7.1 wrapper"
          git push origin HEAD:dev
